name: Build Blue Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q BlueMusic-FINAL-Project.zip -d project
          find project -maxdepth 2 -type f | head -50

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: |
          cd project/BlueMusic-FINAL
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueMusic-debug-apk
          path: project/BlueMusic-FINAL/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
